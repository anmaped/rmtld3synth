name: Web Build

on:
  push:
    branches:
      - v0.*
    tags:
      - 'v*' # Push events to matching v*, i.e. v0.6

permissions: read-all

jobs:
  set_gh_pages:
    name: Build web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: run anmaped/rmtld3synth image
        run: |
          docker run --rm \
          --entrypoint /bin/bash \
          -v ${PWD}:/workspace/source:z  \
          docker.io/anmaped/rmtld3synth:${{ github.ref_name }} \
          -c 'cp -r /workspace/source /localsource && cd /localsource && \
          eval $(opam env) && \
          ./configure && make js && make wasm && \
          mkdir -p /workspace/source/public && \
          cp _build/default/src/rmtld3synth.bc.js /workspace/source/public/rmtld3synth.js && \
          cp _build/default/src/rmtld3synth.bc.wasm.js /workspace/source/public/rmtld3synth.wasm.js && \
          sed -i "s/rmtld3synth.bc.wasm.assets/rmtld3synth.wasm.assets/g" /workspace/source/public/rmtld3synth.wasm.js && \
          mkdir -p /workspace/source/public/rmtld3synth.wasm.assets && \
          cp -r _build/default/src/rmtld3synth.bc.wasm.assets/. /workspace/source/public/rmtld3synth.wasm.assets'

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifact-${{ github.sha }}
          path: ./public/
